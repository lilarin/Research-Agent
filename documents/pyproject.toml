[project]
name = "documents"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arq>=0.27,<0.29",
    "fastapi>=0.115,<1",
    "langchain-ollama>=0.3,<1",
    "langgraph-checkpoint-postgres>=3,<4",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic-settings>=2,<3",
    "python-multipart>=0.0.20",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
worker = [
    "docling-slim[convert-core,feat-chunking,feat-ocr-rapidocr,format-html,format-markdown,format-office,format-pdf]>=2,<3",
]
