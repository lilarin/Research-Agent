[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arq>=0.27.0",
    "aerich>=0.9.1",
    "arize-phoenix-otel>=0.16,<1",
    "asyncpg>=0.30.0",
    "fastapi>=0.141.1",
    "httpx>=0.28,<1",
    "langchain-ollama>=0.3.10",
    "langchain-litellm>=0.6.3",
    "langgraph>=0.6.0",
    "openinference-instrumentation-langchain>=0.1,<1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sse-starlette>=3.3.3",
    "tortoise-orm>=0.25.1",
    "uvicorn>=0.52.4",
]

[tool.aerich]
tortoise_orm = "app.database.TORTOISE_ORM"
location = "./migrations"
src_folder = "./"
